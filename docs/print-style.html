<style>
  @page { size: A4; margin: 18mm 16mm 18mm 16mm; }
  html { font-size: 11pt; }
  body {
    font-family: "Times New Roman", "PT Serif", Georgia, serif;
    font-size: 11pt; line-height: 1.35; color: #000; background: #fff;
    max-width: 178mm; margin: 0 auto; padding: 0; hyphens: auto;
  }
  h1 { font-size: 16pt; margin: 0 0 6pt; line-height: 1.2; }
  h2 { font-size: 13pt; margin: 14pt 0 4pt; }
  h3 { font-size: 11.5pt; margin: 10pt 0 3pt; }
  h1, h2, h3 { page-break-after: avoid; break-after: avoid; }
  p, li { margin: 3pt 0; text-align: justify; }
  ul, ol { padding-left: 18pt; margin: 3pt 0; }
  a { color: #000; text-decoration: none; word-break: break-all; }
  code { font-family: Menlo, Consolas, monospace; font-size: 0.88em; }
  table {
    border-collapse: collapse; width: 100%; margin: 6pt 0;
    font-size: 9.5pt; page-break-inside: avoid; break-inside: avoid;
  }
  th, td { border: 1px solid #000; padding: 2pt 4pt; vertical-align: top; text-align: left; }
  th { background: #eee; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  img { max-width: 100%; display: block; margin: 6pt auto 2pt; border: 1px solid #999; }
  p:has(> img) { text-align: center; }
</style>
